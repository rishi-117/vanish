# The backend listens on 8080 by default. The frontend dev server uses 5173.
server.port=8080

# Do not print stack traces or internal details to the browser.
server.error.include-message=never
server.error.include-stacktrace=never

# Keep shutdown clean when you press Ctrl+C.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s

# We do not want Spring to log request bodies. It never does by default,
# and nothing in this app logs a message, which is intentional.
logging.level.root=INFO
